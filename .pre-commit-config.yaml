repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.75
    hooks:
      - id: ty
        # Codebase has pre-existing type errors; run explicitly with
        #   uv run pre-commit run ty --hook-stage manual --all-files
        # or `uv run ty check`, and wire into CI. Flip to the default
        # stages once the tree is clean.
        stages: [manual]
