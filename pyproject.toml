[project]
name = "act"
version = "0.1.0"
description = "ACT: Action Chunking with Transformers"
readme = "README.md"
requires-python = ">=3.8.10,<3.11"
dependencies = [
    "torch==2.0.0",
    "torchvision==0.15.0",
    "pyquaternion==0.9.9",
    "pyyaml==6.0",
    "rospkg==1.5.0",
    "pexpect==4.8.0",
    "mujoco==2.3.7",
    "dm-control==1.0.14",
    "opencv-python==4.7.0.72",
    "matplotlib==3.7.1",
    "einops==0.6.0",
    "diffusers==0.11.1",
    "huggingface-hub<0.25",
    "packaging==23.0",
    "h5py==3.8.0",
    "ipython==8.12.0",
    "numpy<2",
    "scipy",
    "pandas",
    "seaborn",
    "tqdm",
    "detr",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
detr = { path = "detr", editable = true }
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[tool.setuptools]
py-modules = [
    "constants",
    "ee_sim_env",
    "ee_transforms",
    "imitate_episodes",
    "policy",
    "record_sim_episodes",
    "scripted_policy",
    "sim_env",
    "utils",
    "visualize_episodes",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = ["detr/util", "detr/models/position_encoding.py", "lerobot_bridge"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.environment]
python-version = "3.8"

[tool.ty.rules]
unresolved-import = "ignore"

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
